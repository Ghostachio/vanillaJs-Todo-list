<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>To Do App</title>
  </head>
  <body>
    <main class="container">
      <section class="header">
        <h1>Today's Todo List</h1>
        <h2 id="numTasks">No Tasks For Today yet</h2>
      </section>

      <section class="add-todo">
        <input type="text" id="task" placeholder="Add Your Task" />
        <span class="material-symbols-outlined add"> add_circle </span>
      </section>
      <section class="todos">
        <ul class="todos-list"></ul>
      </section>
      <section class="buttons">
        <button class="btn" id="clear">Clear All</button>
        <button class="btn" id="all-done">Mark All as Done</button>
      </section>
    </main>
  </body>
</html>
